<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Kalam:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#6366f1", // Indigo 500
                        primaryDark: "#4f46e5", // Indigo 600
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                        "sidebar-light": "#ffffff",
                        "sidebar-dark": "#1e293b",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        handwritten: ["Kalam", "cursive"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                    },
                    animation: {
                        'pulse-bar-1': 'pulse-bar 1s infinite ease-in-out',
                        'pulse-bar-2': 'pulse-bar 1.2s infinite ease-in-out 0.1s',
                        'pulse-bar-3': 'pulse-bar 0.8s infinite ease-in-out 0.2s',
                        'pulse-bar-4': 'pulse-bar 1.1s infinite ease-in-out 0.3s',
                        'pulse-bar-5': 'pulse-bar 0.9s infinite ease-in-out 0.4s',
                    },
                    keyframes: {
                        'pulse-bar': {
                            '0%, 100%': { height: '20%' },
                            '50%': { height: '100%' },
                        }
                    }
                },
            },
        };
    </script>
<style>
        .grid-bg {
            background-size: 20px 20px;
            background-image: linear-gradient(to right, rgba(99, 102, 241, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
        }
        .dark .grid-bg {
             background-image: linear-gradient(to right, rgba(99, 102, 241, 0.1) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(99, 102, 241, 0.1) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display h-screen flex overflow-hidden text-slate-800 dark:text-slate-200">

</div>
<nav class="space-y-1">

</div>

<main class="flex-1 flex flex-col h-full relative overflow-hidden">
<div class="absolute top-6 right-6 z-20">

<section class="flex-1 relative bg-white dark:bg-slate-900 grid-bg overflow-hidden">
<div class="w-full h-full flex items-center justify-center p-8 relative">
<div class="relative w-full max-w-4xl aspect-video rounded-2xl p-6">
<svg class="w-full h-full drop-shadow-sm" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
<line class="text-slate-400" marker-end="url(#arrow)" stroke="currentColor" stroke-width="2" x1="50" x2="750" y1="400" y2="400"></line>
<line class="text-slate-400" marker-end="url(#arrow)" stroke="currentColor" stroke-width="2" x1="50" x2="50" y1="400" y2="50"></line>
<text class="font-handwritten text-xl fill-slate-600 dark:fill-slate-300" x="760" y="405">x (distance)</text>
<text class="font-handwritten text-xl fill-slate-600 dark:fill-slate-300" x="40" y="40">y (hauteur)</text>
<path d="M 50 400 Q 250 50 450 400" fill="none" stroke="url(#gradientStroke)" stroke-dasharray="10,5" stroke-width="4"></path>
<circle class="fill-primary" cx="250" cy="225" r="8"></circle>
<line marker-end="url(#arrowRed)" stroke="#ef4444" stroke-width="3" x1="250" x2="320" y1="225" y2="225"></line>
<text class="font-handwritten text-lg fill-red-500" x="330" y="230">Vx</text>
<line marker-end="url(#arrowRed)" stroke="#ef4444" stroke-width="3" x1="50" x2="100" y1="400" y2="280"></line>
<text class="font-handwritten text-lg fill-red-500" x="110" y="300">V0</text>
<g class="font-handwritten text-2xl fill-slate-700 dark:fill-slate-200">
<text x="500" y="100">Équations du mouvement:</text>
<text x="500" y="140">x(t) = v₀ cos(θ) t</text>
<text x="500" y="180">y(t) = v₀ sin(θ) t - ½ g t²</text>
<text class="fill-primary text-xl" x="500" y="250">Portée maximale (R):</text>
<text x="500" y="290">R = (v₀² sin(2θ)) / g</text>
</g>
<defs>
<marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="3">
<path class="fill-slate-400" d="M0,0 L0,6 L9,3 z"></path>
</marker>
<marker id="arrowRed" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="3">
<path d="M0,0 L0,6 L9,3 z" fill="#ef4444"></path>
</marker>
<linearGradient id="gradientStroke" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#6366f1"></stop>
<stop offset="100%" stop-color="#a855f7"></stop>
</linearGradient>
</defs>
</svg>
</div>

<div class="absolute left-6 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 p-2 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 flex flex-col gap-3">

<div class="w-2.5 bg-gradient-to-t from-indigo-500 to-violet-500 rounded-full animate-pulse-bar-5 shadow-sm shadow-indigo-500/30"></div>
</div>
<div class="justify-self-end">
<button class="flex items-center gap-2 px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl transition-all duration-200 font-medium shadow-md shadow-red-600/20 active:scale-95">
<span class="material-icons-round">logout</span>
            Quitter la discussion
