<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tutor'IA Voice Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 3s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 20px rgba(19, 91, 236, 0.3)' },
                            '100%': { boxShadow: '0 0 50px rgba(19, 91, 236, 0.7), 0 0 100px rgba(19, 91, 236, 0.4)' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        /* Custom utilities for the fluid effect */
        .orb-core {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(19, 91, 236, 0.5) 20%, rgba(19, 91, 236, 1) 60%, #0a2e7a 100%);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased overflow-hidden selection:bg-primary selection:text-white">
<!-- Main Container -->
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<!-- Background Ambient Effects -->
<div class="absolute inset-0 z-0 pointer-events-none">
<!-- Deep gradient background -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#1a2c50] via-background-dark to-background-dark opacity-80"></div>
<!-- Subtle noise overlay (optional texture) -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBSuzJjVLTzEKplV-NJnv46Xir-C3ATeCK1FxYt8hStKZnMsSDF0tn8Cu2fMKIJQ6YPGui3dfGHTfbwvCN7wSUSk09XJNngVqNuRq7QFn1ZQf96WApX899zaJxsZcblkfPKnQrKd5hNLfBxYSVtd1cOQo5i1BDe9RajWslKqwg_NWIrbRSfjxqMyGMm2s2Kg9pVWRKMcz3mYzviKaw-Y7bV3TwE_lRCiI91gCXfCLZqSsI8Bpp5axVK3HQy7UJeccx2xdgpMVaHovU');"></div>
</div>
<!-- Header -->
<header class="relative z-10 flex w-full items-center justify-between px-6 py-4 md:px-10">
<div class="flex items-center gap-3 text-white/90 transition-opacity hover:opacity-100 cursor-pointer">
<div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary/20 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary text-[20px]">school</span>
</div>
<h1 class="text-lg font-bold tracking-tight">Tutor'IA</h1>
</div>
<!-- Connection Status -->
<div class="flex items-center gap-2 rounded-full bg-white/5 px-3 py-1.5 backdrop-blur-sm border border-white/5">
<div class="h-2 w-2 rounded-full bg-green-500 animate-pulse"></div>
<span class="text-xs font-medium text-slate-300 uppercase tracking-widest">Live</span>
</div>
</header>
<!-- Central Interaction Area -->
<main class="relative z-10 flex flex-1 flex-col items-center justify-center px-4">
<!-- Status Text -->
<div class="mb-12 text-center transition-all duration-500 ease-in-out">
<h2 class="text-2xl font-light text-white md:text-3xl lg:text-4xl animate-pulse-slow tracking-wide">
                    Tutor'IA vous écoute...
                </h2>
</div>
<!-- The Orb Visualization -->
<div class="relative flex items-center justify-center w-80 h-80 md:w-96 md:h-96">
<!-- Outer Ripple 1 -->
<div class="absolute inset-0 rounded-full border border-primary/20 scale-125 animate-[pulse_3s_ease-in-out_infinite]"></div>
<!-- Outer Ripple 2 -->
<div class="absolute inset-0 rounded-full border border-primary/10 scale-150 animate-[pulse_4s_ease-in-out_infinite_reverse]"></div>
<!-- Glow Container -->
<div class="absolute inset-0 rounded-full bg-primary/10 blur-[60px] animate-pulse-slow"></div>
<!-- Main Orb Avatar -->
<div class="relative h-48 w-48 md:h-56 md:w-56 rounded-full orb-core shadow-[0_0_80px_rgba(19,91,236,0.6)] animate-float flex items-center justify-center">
<!-- Inner fluid texture overlay -->
<div class="absolute inset-0 rounded-full bg-gradient-to-t from-black/20 to-transparent mix-blend-overlay"></div>
<!-- Inner icon representing the brain/core (Abstract) -->
<span class="material-symbols-outlined text-white/50 text-[64px] mix-blend-overlay animate-pulse">
                        graphic_eq
                    </span>
</div>
</div>
<!-- Live Transcript Area -->
<div class="mt-12 w-full max-w-2xl px-6 text-center">
<p class="text-lg text-slate-400 font-light leading-relaxed animate-[fadeIn_2s_ease-out]">
                    "<span class="text-white/90">Pouvez-vous m'expliquer</span> la théorie de la relativité générale en termes simples ?"
                </p>
<!-- Typing indicator simulation -->
<div class="mt-4 flex justify-center gap-1 opacity-50">
<div class="h-1.5 w-1.5 rounded-full bg-primary animate-bounce"></div>
<div class="h-1.5 w-1.5 rounded-full bg-primary animate-bounce delay-100"></div>
<div class="h-1.5 w-1.5 rounded-full bg-primary animate-bounce delay-200"></div>
</div>
</div>
</main>
<!-- Control Dock -->
<footer class="relative z-20 flex justify-center pb-8 pt-4">
<div class="flex items-center gap-4 rounded-full bg-[#1e293b]/80 backdrop-blur-xl border border-white/10 p-2 shadow-2xl transition-transform hover:scale-[1.02]">
<!-- Mute Toggle -->
<button aria-label="Toggle Mute" class="group relative flex h-14 w-14 items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-white transition-colors">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;">mic</span>
<!-- Tooltip -->
<span class="absolute -top-10 left-1/2 -translate-x-1/2 rounded bg-black px-2 py-1 text-xs text-white opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Mute</span>
</button>
<!-- Visualization Toggle (Camera - Optional extra context) -->
<button aria-label="Toggle Camera" class="group relative flex h-14 w-14 items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-white transition-colors">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;">videocam_off</span>
</button>
<div class="h-8 w-px bg-white/10 mx-1"></div>
<!-- Exit Button -->
<button class="group flex h-12 items-center gap-2 rounded-full bg-red-500/10 hover:bg-red-500/20 px-6 pr-8 text-red-400 hover:text-red-300 border border-red-500/20 transition-all duration-300">
<div class="flex h-8 w-8 items-center justify-center rounded-full bg-red-500 text-white">
<span class="material-symbols-outlined text-[18px]">close</span>
</div>
<span class="text-sm font-bold tracking-wide">Exit Voice Mode</span>
</button>
</div>
</footer>
</div>
</body></html>
